name: build RabbitMQ.Client.OpenTelemetry package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'otel- tag to build, for example otel-1.0.0-rc.3'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-otel-package:
    runs-on: windows-latest
    # https://github.com/NuGet/Home/issues/11548
    env:
      NUGET_CERT_REVOCATION_MODE: offline
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag name
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^otel-\d+\.\d+\.\d+(-rc\.\d+)?$') {
            throw "'$env:TAG' is not an otel- release tag"
          }
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          # MinVer needs the vX.Y.Z tag too, to version the RabbitMQ.Client dependency.
          fetch-depth: 0
          submodules: true
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build (Release)
        run: dotnet build ${{ github.workspace }}\projects\RabbitMQ.Client.OpenTelemetry\RabbitMQ.Client.OpenTelemetry.csproj --configuration Release --property CI=true
      - name: Verify package version and RabbitMQ.Client dependency
        shell: pwsh
        run: |
          $clientTag = git describe --tags --exact-match --match 'v*' HEAD
          if ($LASTEXITCODE -ne 0) { throw "$env:TAG is not on a vX.Y.Z commit" }
          $expectedClient = $clientTag -replace '^v', ''
          $expectedVersion = $env:TAG -replace '^otel-', ''
          $nupkg = "packages/RabbitMQ.Client.OpenTelemetry.$expectedVersion.nupkg"
          if (-not (Test-Path $nupkg)) { throw "$nupkg was not produced" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $nupkg))
          try {
            $entry = $zip.Entries | Where-Object FullName -eq 'RabbitMQ.Client.OpenTelemetry.nuspec'
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }

          $metadata = $nuspec.package.metadata
          if ($metadata.version -ne $expectedVersion) {
            throw "package version is $($metadata.version), expected $expectedVersion"
          }
          $deps = @($metadata.dependencies.group | ForEach-Object { $_.dependency } | Where-Object id -eq 'RabbitMQ.Client')
          if ($deps.Count -eq 0) { throw 'no RabbitMQ.Client dependency found' }
          foreach ($dep in $deps) {
            if ($dep.version -ne $expectedClient) {
              throw "RabbitMQ.Client dependency is $($dep.version), expected $expectedClient"
            }
          }
          Write-Output "RabbitMQ.Client.OpenTelemetry $expectedVersion depends on RabbitMQ.Client $expectedClient"
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RabbitMQ.Client.OpenTelemetry-${{ inputs.tag }}
          path: |
            packages/RabbitMQ.Client.OpenTelemetry.*.nupkg
            packages/RabbitMQ.Client.OpenTelemetry.*.snupkg
          if-no-files-found: error
